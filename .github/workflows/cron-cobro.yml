name: Cron Cobro Clientes

on:
  schedule:
    # Ejecuta cada hora en punto (minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  disparar-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint horario de cobro a clientes
        run: |
          curl -fsS -X GET "https://cofiado-api.vercel.app/api/cron-cobro-clientes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --retry 3 \
            --retry-delay 5
